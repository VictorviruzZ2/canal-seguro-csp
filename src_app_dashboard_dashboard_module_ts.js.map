<div class="w-full my-3">
  <div class="relative flex flex-col w-full h-full text-gray-700 bg-white shadow-md rounded-lg bg-clip-border">
    <table class="w-full text-left table-auto min-w-max">
      <thead>
        <tr>
          <th class="p-4 border-b border-slate-200 bg-zinc-200">
            <p class="uppercase text-lg font-normal leading-none text-[#0f5dac]">
              No.
            </p>
          </th>
          <th class="p-4 border-b border-slate-200 bg-zinc-200">
            <p class="uppercase text-lg font-normal leading-none text-[#0f5dac]">
              Titular
            </p>
          </th>
          <th class="p-4 border-b border-slate-200 bg-zinc-200">
            <p class="uppercase text-lg font-normal leading-none text-[#0f5dac]">
              Cédula de Identidad
            </p>
          </th>
          <th class="p-4 border-b border-slate-200 bg-zinc-200">
            <p class="uppercase text-lg font-normal leading-none text-[#0f5dac]">
              Fecha Afiliación
            </p>
          </th>
          <th class="p-4 border-b border-slate-200 bg-zinc-200">
            <p class="uppercase text-lg font-normal leading-none text-[#0f5dac]">
              Acciones
            </p>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr class="hover:bg-slate-50 border-b border-slate-200" *ngFor="let item of dataSource">
          <td class="p-4 py-5">
            <p class="block font-[200] text-lg text-slate-800">{{ item.number }}</p>
          </td>
          <td class="p-4 py-5">
            <p class="text-lg font-[200] uppercase text-[#5c5c5c]">{{ item.fullName }}</p>
          </td>
          <td class="p-4 py-5">
            <p class="text-lg font-[200] uppercase text-[#5c5c5c]">{{ item.document }}</p>
          </td>
          <td class="p-4 py-5">
            <p class="text-lg font-[200] uppercase text-[#5c5c5c]">{{ item.affiliationDate }}</p>
          </td>
          <td class="p-4 py-5">
            <div class="flex justify-start items-center gap-5">
              <span class="cursor-pointer" title="Ver certificado" (click)="certificateActions( item, 'V' )"
                *ngIf="!isMobile">
                <svg class="w-8 h-8 text-gradient dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                  width="24" height="24" fill="none" viewBox="0 0 24 24">
                  <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" style="stop-color:#e91c89;stop-opacity:1" />
                      <stop offset="100%" style="stop-color:#0f5dac;stop-opacity:1" />
                    </linearGradient>
                  </defs>
                  <path stroke="url(#grad1)" stroke-width="2"
                    d="M21 12c0 1.2-4.03 6-9 6s-9-4.8-9-6c0-1.2 4.03-6 9-6s9 4.8 9 6Z" />
                  <path stroke="url(#grad1)" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
              </span>

              <span class="cursor-pointer text-black" title="Descargar certificado"
                (click)="certificateActions( item, 'D' )">
                <svg id="download_black_24dp" xmlns="http://www.w3.org/2000/svg" width="20px" height="20px"
                  viewBox="0 0 11.175 13.569" fill="currentColor">
                  <defs>
                    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" style="stop-color:#e91c89;stop-opacity:1" />
                      <stop offset="100%" style="stop-color:#0f5dac;stop-opacity:1" />
                    </linearGradient>
                  </defs>
                  <path id="Trazado_654" data-name="Trazado 654"
                    d="M5,16.569H16.175v-1.6H5Zm11.175-8.78H12.982V3H8.193V7.789H5l5.587,5.587Z"
                    transform="translate(-5 -3)" fill="url(#grad2)" />
                </svg>
              </span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="flex justify-between items-center px-4 py-3"></div>
    <div class="text-md text-slate-500 ml-4">
      Mostrando <b>1 - {{ dataSource.length }}</b> de {{ dataSource.length }} resultado/s
    </div>
  </div>
</div>

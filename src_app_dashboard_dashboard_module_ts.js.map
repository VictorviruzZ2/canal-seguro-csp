<mat-card>
  <mat-card-content class="bg-transparent">
    <mat-tab-group mat-align-tabs="center">
      <mat-tab *ngIf="(maximumProtectionInsurance$ | async)?.length! > 0">
        <ng-template mat-tab-label>
          <mat-icon class="mr-2">paid</mat-icon>
          Seguro Máxima Protección
        </ng-template>
        <app-insurance-panel-item [insurance]="(maximumProtectionInsurance$ | async)!"></app-insurance-panel-item>
      </mat-tab>
      <mat-tab *ngIf="(familyLifeInsurance$ | async)?.length! > 0">
        <ng-template mat-tab-label>
          <mat-icon class="mr-2">diversity_1</mat-icon>
          Seguro Vida Familia
        </ng-template>
        <app-insurance-panel-item [insurance]="(familyLifeInsurance$ | async)!"></app-insurance-panel-item>
      </mat-tab>
      <mat-tab *ngIf="(xsInsurance$ | async)?.length! > 0">
        <ng-template mat-tab-label>
          <mat-icon class="mr-2">diversity_3</mat-icon>
          Seguro Inclusivo
        </ng-template>
        <app-insurance-panel-item [insurance]="(xsInsurance$ | async)!"></app-insurance-panel-item>
      </mat-tab>
      <mat-tab *ngIf="(oncologicalInsurance$ | async)?.length! > 0">
        <ng-template mat-tab-label>
          <mat-icon class="mr-2">diversity_2</mat-icon>
          Seguro Oncológico
        </ng-template>
        <app-insurance-panel-item [insurance]="(oncologicalInsurance$ | async)!"></app-insurance-panel-item>
      </mat-tab>
      <mat-tab *ngIf="(sapInsurance$ | async)?.length! > 0">
        <ng-template mat-tab-label>
          <mat-icon class="mr-2">diversity_2</mat-icon>
          Seguro SAP
        </ng-template>
        <app-insurance-panel-item [insurance]="(sapInsurance$ | async)!"></app-insurance-panel-item>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>

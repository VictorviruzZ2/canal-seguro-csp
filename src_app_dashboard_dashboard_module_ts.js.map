<h2 mat-dialog-title class="text-lg uppercase text-[#e91c89]"></h2>
<mat-dialog-content class="mat-typography">
  <div class="iframe-container">
    <iframe [src]="safeUrl" class="responsive-iframe"></iframe>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button color="accent" mat-dialog-close>
    <mat-icon>close</mat-icon>
    <p class="text-[#0f5dac]">Cerrar</p>
  </button>
  <button mat-button color="primary" mat-dialog-close (click)="downloadPdf()">
    <mat-icon>download</mat-icon>
    <p class="text-[#e91c89]">Descargar</p>
  </button>
</mat-dialog-actions>

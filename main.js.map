<mat-card>
  <mat-card-header class="flex flex-col">
    <h2 class="text-3xl uppercase font-bold text-[#0f5dac]">
      <mat-icon class="scale-[1.6] mr-2 text-[#e91c89]">{{ iconText }}</mat-icon>
      {{ principalText }}
    </h2>
    <p class="text-lg text-[#5c5c5c] mb-2 uppercase">{{ secondText }}</p>
  </mat-card-header>
</mat-card>

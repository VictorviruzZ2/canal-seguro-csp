<div>
  <h1 mat-dialog-title class="text-yellow-500 font-roundkey uppercase">{{ data.title }}</h1>
<div mat-dialog-content>
  <p class="text-lg uppercase">{{ data.message }}</p>
</div>
<div mat-dialog-actions class="flex justify-center">
  <button mat-button color="warn"  *ngIf="data.cancelButton" (click)="onCancel()">Cancelar</button>
  <button class="bg-primary text-lg uppercase py-1 px-5 rounded-full" *ngIf="data.acceptButton" [mat-dialog-close]="true">Aceptar</button>
</div>

</div>

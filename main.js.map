<mat-sidenav-container class="fixed bg-transparent" autosize>
  <mat-sidenav [opened]="true" [mode]="isMobile ? 'over' : 'side'">
    <mat-nav-list>
      <a mat-list-item (click)="onNavigate(item.route)" *ngFor="let item of navItems" class="pl-[10px]">
        <span class="entry" [ngClass]=" currentRoute === item.route ? 'border-l-[10px] border-pink-600' : ''">
          <mat-icon class="text-gradient scale-[1.4]">{{ item.icon }}</mat-icon>
          <span class="text-xl text-[#5c5c5c] uppercase">{{ item.description }}</span>
        </span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="w-[95%] lg:w-[90%] mx-auto p-2 lg:p-4 rounded-xl mt-4 h-full">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

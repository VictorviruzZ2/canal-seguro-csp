<button mat-button [matMenuTriggerFor]="menu">
    <span class="hidden sm:block uppercase text-[#0f5dac] ml-2">{{ (customer$ | async)?.fullName }}</span>
    <mat-icon class="scale-[2] text-gradient">account_circle</mat-icon>
</button>

<mat-menu #menu="matMenu">
  <button mat-menu-item disabled>
    <mat-icon class="text-gradient">person</mat-icon>
    <span class="uppercase">{{ (customer$ | async)?.fullName }}</span>
  </button>
  <button mat-menu-item (click)="onLogout()">
    <mat-icon class="text-gradient">logout</mat-icon>
    <span class="uppercase">Cerrar Sesión</span>
  </button>
</mat-menu>

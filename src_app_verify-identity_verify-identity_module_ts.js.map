<h3 class="text-3xl uppercase border-l-[16px] border-pink-600 pl-2 text-[#0f5dac] font-bold">Verifica tu número de celular</h3>
<p class="text-xl text-slate-600 pl-3 mb-2">Por favor, confirme si este es su número de celular:</p>

<div class="flex flex-col justify-center items-center mt-14 mb-4">
  <mat-icon aria-hidden="false" fontIcon="phone_iphone" class="scale-[6] text-gradient"></mat-icon>
  <h2 class="uppercase text-[#e91c89] text-xl mt-[4.5rem]">Número de celular: <span class="text-[#0f5dac]">{{ ( customer$ | async )?.phoneNumber }}</span></h2></div>

<mat-divider></mat-divider>

<div class=" flex flex-col justify-center items-center">
  <button class="bg-primary py-2 px-2 rounded-full mt-4 text-lg uppercase flex justify-center gap-1 animate__animated animate__fadeInUp animate__faster" (click)="onCheck(true)" *ngIf="counter === 0">
    <mat-icon fontIcon="check"></mat-icon>
    <span>Sí, es mi número</span>
  </button>

  <button class="bg-primary py-2 px-2 rounded-full mt-4 text-lg uppercase w-full lg:w-[50%] flex justify-center gap-1 cursor-not-allowed" *ngIf="counter !== 0">
    <span>Por favor, valida tu información ({{ counter }}s)</span>
  </button>

  <button class="bg-primary py-2 px-2 rounded-full mt-4 text-lg uppercase flex justify-center gap-1 animate__animated animate__fadeInUp animate__faster" (click)="onCheck(false)" *ngIf="counter === 0">
    <mat-icon fontIcon="close"></mat-icon>
    <span>No es mi número</span>
  </button>
</div>

<h3 class="text-3xl uppercase border-l-[16px] border-pink-600 pl-2 text-[#0f5dac] font-bold">Confirmación de Identidad</h3>
<p class="text-xl text-slate-600 pl-3">Por favor, valide la información mostrada:</p>

<div class="flex flex-col justify-center items-center mt-3 text-center" *ngIf="!( loader$ | async )">
  <picture>
    <img src="../../../../assets/icons/admin.svg" alt="" class="w-28">
  </picture>
  <h2 class="uppercase text-[#e91c89] text-lg lg:text-xl mb-1 mt-2">Nombre:
    <br>
    <span class="text-[#0f5dac] mr-2 lg:mr-2">{{ fullName }}</span>
    <span class="text-[#0f5dac] mr-2 lg:mr-2">{{ surname }}</span>
    <span class="text-[#0f5dac]">{{ secondSurname }}</span>
  </h2>
  <h3 class="uppercase text-[#e91c89] text-lg lg:text-xl">Cédula de identidad: <br> <span class="text-[#0f5dac]">{{ identification }}</span></h3>
</div>

<mat-divider></mat-divider>

<div class=" flex flex-col justify-center items-center">
  <button class="bg-primary py-2 px-2 rounded-full mt-4 text-lg uppercase w-36 flex justify-center gap-1 animate__animated animate__fadeInUp animate__faster" (click)="onCheck(true)" *ngIf="counter === 0">
    <mat-icon fontIcon="check"></mat-icon>
    <span>Si, soy yo</span>
  </button>

  <button class="bg-primary py-2 px-2 rounded-full mt-4 text-lg uppercase w-full lg:w-[50%] flex justify-center gap-1 cursor-not-allowed" *ngIf="counter !== 0">
    <span>Por favor, valida tu información ({{ counter }}s)</span>
  </button>

  <button class="bg-primary py-2 px-2 rounded-full mt-4 text-lg uppercase w-36 flex justify-center gap-1 animate__animated animate__fadeInUp animate__faster" (click)="onCheck(false)" *ngIf="counter === 0">
    <mat-icon fontIcon="close"></mat-icon>
    <span>No soy yo</span>
  </button>
</div>

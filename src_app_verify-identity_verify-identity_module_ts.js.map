<div class="top-background"></div>
<div class="w-[95%] lg:w-[90%] mx-auto bg-neutral-100/60 p-2 lg:p-4 rounded-xl">
  <picture class="flex justify-center md:justify-end my-2 lg:my-3">
    <app-logo whidthLogo="170px"></app-logo>
  </picture>

  <hr>
  <div class="w-full mx-auto bg-neutral-100/60 p-2 lg:p-4 rounded-xl">

    <mat-stepper class="example-stepper" [orientation]="(stepperOrientation | async)!" #stepper [linear]="false">

      <mat-step>
        <ng-template matStepLabel>Introduce tus datos</ng-template>

        <ng-template matStepContent>
          <mat-card class="w-full sm:w-[80%] lg:w[90%] min-h-[350px] mx-auto shadow-md bg-transparent">
            <mat-card-content>
              <app-identification-data (goToStepTwo)="nextStep( $event )"></app-identification-data>
            </mat-card-content>
          </mat-card>
        </ng-template>
      </mat-step>

      <mat-step>
        <ng-template matStepLabel>Verifica tu identidad</ng-template>

        <ng-template matStepContent>
          <mat-card class="w-full sm:w-[80%] lg:w[90%] min-h-[350px] mx-auto shadow-md bg-transparent">
            <mat-card-content>
              <app-check-information (goToStepThree)="nextStep( $event )"></app-check-information>
            </mat-card-content>
          </mat-card>
        </ng-template>
      </mat-step>

      <mat-step>
        <ng-template matStepLabel>Verifica tu celular</ng-template>

        <ng-template matStepContent>
          <mat-card class="w-full sm:w-[80%] lg:w[90%] min-h-[350px] mx-auto shadow-md bg-transparent">
            <mat-card-content>
              <app-check-phone (goToStepFour)="nextStep( $event )"></app-check-phone>
            </mat-card-content>
          </mat-card>
        </ng-template>
      </mat-step>

      <mat-step>
        <ng-template matStepLabel>Ingresa tu código</ng-template>

        <ng-template matStepContent>
          <mat-card class="w-full sm:w-[80%] lg:w[90%] min-h-[350px] mx-auto shadow-md bg-transparent">
            <mat-card-content>
              <app-otp-validate></app-otp-validate>
            </mat-card-content>
          </mat-card>
        </ng-template>
      </mat-step>

    </mat-stepper>

  </div>

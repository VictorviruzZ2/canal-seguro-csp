<h3 class="text-3xl uppercase border-l-[16px] border-pink-600 pl-2 text-[#0f5dac] font-bold">Ingresa tu código de verificación</h3>
<p class="text-xl text-slate-600 pl-3">Favor coloca en este campo el código enviado por mensaje de texto (SMS) al celular que dejaste registrado en agencia.</p>
<div class="flex justify-start items-center gap-2 text-yellow-500 mb-2 pl-2">
  <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="warning"></mat-icon>
  <p class="text-lg">No compartas esta información con terceras personas.</p>
</div>

<mat-divider></mat-divider>

<code-input [isCodeHidden]="false"
              [codeLength]="6"
              (codeChanged)="onCodeChanged($event)"
              (codeCompleted)="onCodeCompleted($event)"
              class="w-full lg:w-[50%] mx-auto mt-8 mb-3">
</code-input>

<div class="flex justify-center" *ngIf="!isValidCode">
  <div class="alert-error" >
    Por favor, ingrese el código recibido, asegurándose de usar únicamente números.
  </div>
</div>

<div class="flex justify-center mt-5">
  <button class="bg-primary text-lg uppercase py-2 px-8 rounded-full animate__animated animate__pulse animate__infinite	infinite animate__slow" (click)="onVerifyCode()">
    Ingresar
  </button>
</div>
